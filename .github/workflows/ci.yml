# Le pipeline de CircuitCourt. Pour l'instant, il ne fait que lancer les tests.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "deploy/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "deploy/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
    # anciennement test
      - run: npm run test:coverage
    # anciennement job lint
      - run: npm run lint
    # anciennement job build
      - run: npm run build
    # anciennement security > secrets
      - run: npm run gitleaks
    # anciennement security > dependencies
      - run: npm audit --omit=dev --audit-level=high
    # anciennement security > http-headers
      - name: HTTP security headers
        run: |
          npm start &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent http://localhost:3000/health
          npm run observatory -- circuitcourt.localhost:3000 60
    # upload du resultat de coverage pour sona
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    needs: [verify]
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : SonarQube repère le « nouveau code »
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  image:
    needs: [verify, sonar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/circuitcourt
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
